<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTF | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-box">
        <h1>ROBO-TECH FORUM</h1>
        <p class="subtitle">GCOEA </p>

        <div class="form-title">
            <h2 id="formTitle">Login</h2>
            <p id="formText">Login to continue to RTF</p>
        </div>

        <form id="authForm">

            <div id="nameBox" class="input-box hidden">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
                <small id="nameError"></small>
            </div>

            <div class="input-box">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username">
                <small id="usernameError"></small>
            </div>

            <div class="input-box">
                <label>Email</label>
                <input type="text" id="email" placeholder="Enter email">
                <small id="emailError"></small>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password">
                <small id="passwordError"></small>
            </div>

            <div id="confirmBox" class="input-box hidden">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password">
                <small id="confirmError"></small>
            </div>

            <button type="submit" class="auth-btn" id="authButton">
                Login
            </button>
        </form>

        <p class="switch-text">
            <span id="switchMessage">Don't have an account?</span>
            <button id="switchBtn">Sign Up</button>
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
